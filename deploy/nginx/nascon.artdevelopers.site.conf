# Host nginx vhost for nascon.artdevelopers.site.
#
# The domain is proxied through Cloudflare, so this origin only needs a valid
# certificate for the hostname (issued by certbot) and Cloudflare connects to it.
#
# Install:
#   cp deploy/nginx/nascon.artdevelopers.site.conf /etc/nginx/sites-available/
#   ln -sf /etc/nginx/sites-available/nascon.artdevelopers.site.conf \
#          /etc/nginx/sites-enabled/
#   certbot --nginx -d nascon.artdevelopers.site --non-interactive --agree-tos \
#           -m admin@artdevelopers.site --redirect
#   nginx -t && systemctl reload nginx
#
# Everything is forwarded to the compose stack's frontend container, which routes
# /api and /voice internally.

server {
    listen 80;
    listen [::]:80;
    server_name nascon.artdevelopers.site;

    # certbot writes its HTTP-01 challenge here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04) has no standalone `http2 on;` directive, so the
    # older combined form is used — it matches the other vhosts on this host.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nascon.artdevelopers.site;

    # Managed by certbot.
    ssl_certificate /etc/letsencrypt/live/nascon.artdevelopers.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nascon.artdevelopers.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Recordings and uploads.
    client_max_body_size 25m;

    access_log /var/log/nginx/nascon.access.log;
    error_log /var/log/nginx/nascon.error.log;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A queued audio turn can wait behind another one.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
