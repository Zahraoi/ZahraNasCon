# Prometheus alerting rules.
#
# These evaluate in Prometheus and appear in its /alerts page. Grafana reads the same
# data through the ALERTS series, so the overview dashboard shows firing alerts without
# needing a delivery channel. Add a contact point in Grafana (Alerting → Contact points)
# once you have somewhere to send them.

groups:
  - name: nascon-platform
    interval: 30s
    rules:
      - alert: ApiDown
        expr: up{job="nascon-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The API has been unreachable for two minutes.
          description: Prometheus cannot scrape backend:4000/metrics. The site is down for users.

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Redis is not answering.
          description: Caching degrades to no-ops, so this is not fatal, but it is not right either.

      - alert: ExporterDown
        expr: up{job=~"node|cadvisor"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An exporter stopped reporting.
          description: Host or container metrics will have a gap until it comes back.

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of API responses are failing.
          description: Check the browser console and the backend log; this usually means a dependency is down.

      - alert: SlowApi
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_bucket[5m]))) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The 95th percentile is above two seconds.
          description: Sustained, not a single slow request — that is what "for" is for.

      - alert: HostMemoryHigh
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host memory is above 90%.
          description: The box runs other sites too; check before adding more containers.

      - alert: HostDiskHigh
        expr: |
          100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Root filesystem is above 85%.
          description: Docker images and logs are the usual culprits here.

      - alert: DeploymentStuck
        expr: nascon_deploy_in_progress == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: A deployment has been running for over thirty minutes.
          description: The site page expires its notice after thirty minutes; the run itself may be stuck.
