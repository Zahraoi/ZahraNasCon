# SPA + API routing. This container is the application's single entry point; the host
# nginx only terminates TLS and forwards the domain to it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Recordings are ~0.5 MB, uploads up to 8 MB.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Upstreams are resolved at request time through a
    # variable instead of at startup, so nginx does not refuse to boot when a
    # dependency is still coming up (or has been recreated and changed address).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://backend:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /voice/ {
        set $ai_upstream http://ai:8100;
        proxy_pass $ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A turn can legitimately sit in the queue behind another one, so this must
        # comfortably exceed one turn's processing time.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Grafana, under /grafana/ so it needs no host port and no second certificate.
    # Grafana is configured with serve_from_sub_path, so it expects this prefix.
    location /grafana/ {
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: every unknown path is the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
